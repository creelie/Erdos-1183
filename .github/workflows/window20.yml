name: Window checks

on:
  push:
  pull_request:

jobs:
  checkers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - name: Install numpy
        run: python3 -m pip install numpy
      - name: Four checkers and corrupted lists
        run: sh checks/window20/run_checks.sh --no-lean
